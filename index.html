<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DliCOM Community ID Card</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2f6bff;--blue2:#5e8dff;--dark:#060b20;--panel:#0b1230;--line:#29437e}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#18317b 0,#070c21 42%,#02030a 100%);color:#fff;font-family:Inter,Arial,sans-serif;padding:18px 10px 50px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto}
.header{text-align:center;margin:8px 0 22px}.header h1{font-size:clamp(28px,6vw,46px);font-weight:900}.header p{margin-top:7px;color:#9aa9d0;font-size:13px;font-weight:700}
.panel{background:rgba(5,11,31,.96);border:1px solid rgba(94,141,255,.32);border-radius:20px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.title{font-size:21px;font-weight:900;margin-bottom:18px}.field{margin-bottom:16px}label{display:block;color:#91a8e9;font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}
input,select,.select-button{width:100%;height:48px;border:1px solid #293b72;border-radius:11px;background:#080f2b;color:#fff;padding:0 13px;outline:none;font-weight:700}input:focus,select:focus,.select-button:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(82,125,255,.12)}
.select-wrap{position:relative}.select-button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}.select-button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:none;position:absolute;z-index:50;top:55px;left:0;right:0;background:#070d25;border:1px solid #30467e;border-radius:14px;padding:8px;box-shadow:0 20px 50px #000}.menu.open{display:block}.role-list,.country-list{max-height:270px;overflow:auto}.role-option,.country-option{display:flex;align-items:center;gap:10px;padding:11px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}.role-option:hover,.country-option:hover{background:rgba(65,105,255,.16)}.role-option input{width:18px;height:18px;accent-color:var(--blue)}.country-search{margin-bottom:8px}.flag{font-size:19px;width:27px;text-align:center}
.upload{border:1px dashed #3d5896;border-radius:12px;padding:12px;background:#080f2b}.upload input{height:auto;border:0;padding:0;background:transparent}.hint{margin-top:7px;color:#7182aa;font-size:11px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bg-choice{position:relative;border:1px solid #263b6e;border-radius:12px;overflow:hidden;background:#05091b;aspect-ratio:2/3;cursor:pointer}.bg-choice img{width:100%;height:100%;object-fit:cover;display:block}.bg-choice.active{border:3px solid var(--blue2);box-shadow:0 0 0 2px rgba(47,107,255,.25)}.bg-choice .tag{position:absolute;left:7px;bottom:7px;background:rgba(2,5,18,.78);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900}.default-mark{position:absolute;right:7px;top:7px;background:#2f6bff;border-radius:7px;padding:4px 6px;font-size:8px;font-weight:900}
.actions{display:flex;gap:10px;margin-top:20px}.primary,.secondary{height:52px;border:0;border-radius:12px;font-weight:900;flex:1}.primary{color:#fff;background:linear-gradient(135deg,#2f6bff,#6738ff)}.secondary{display:none;background:#fff;color:#07102d}.secondary.show{display:block}
.form-page,.result-page{display:block}.result-page{display:none}.result-page.show{display:block}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.result-head h2{font-size:22px}.back-btn{height:42px;padding:0 14px;border-radius:10px;background:#101a42;color:#fff;border:1px solid #30467e;font-weight:800}
.card-scroll{width:100%;overflow:auto;border-radius:18px;background:#02030a}.card{position:relative;width:1024px;height:1536px;margin:auto;overflow:hidden;background:#05091c;color:#fff}.card-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(2,5,18,.04) 50%,rgba(2,5,18,.20) 100%)}
.card-text{position:absolute;z-index:4;left:82px;right:82px;text-shadow:0 2px 8px rgba(0,0,0,.7)}.name-box{top:855px;height:135px;display:flex;align-items:center}.card-name{font-size:42px;font-weight:900;line-height:1.05;max-width:850px;word-break:break-word}.card-x{margin-top:7px;color:#9bb7ff;font-size:18px;font-weight:800}.left-box{left:84px;right:auto;top:1060px;width:385px;height:330px}.right-box{left:auto;right:84px;top:1060px;width:380px;height:330px}.item{margin-bottom:25px}.item:last-child{margin-bottom:0}.item label{font-size:10px;margin-bottom:5px;color:#79a0ff}.value{font-size:21px;font-weight:900;line-height:1.18;word-break:break-word}.roles-value{font-size:18px;line-height:1.3}.id-chip{position:absolute;z-index:4;left:82px;top:1455px;font-size:12px;font-weight:900;letter-spacing:1px;color:#b8c7f2}.photo{display:none;position:absolute;z-index:6;width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 6px rgba(47,107,255,.3),0 12px 35px #000;right:84px;top:90px}
@media(max-width:600px){body{padding:12px 8px 30px}.panel{padding:15px}.gallery{grid-template-columns:repeat(2,1fr)}.actions{flex-direction:column}.card-scroll{margin:0 -2px}.card{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>DliCOM ID Card</h1><p>Create your DliCOM Community Identity</p></div>

<section id="formPage" class="form-page panel">
<div class="title">Create your card</div>

<div class="field"><label>Name</label><input id="name" type="text" placeholder="Type your name"></div>
<div class="field"><label>X Username</label><input id="xUsername" type="text" placeholder="@username"></div>
<div class="field"><label>Discord Username</label><input id="discord" type="text" placeholder="Discord username"></div>
<div class="field"><label>Gender</label><select id="gender"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div>

<div class="field"><label>Roles</label><div class="select-wrap"><button type="button" class="select-button" id="roleButton"><span id="roleText">Select roles</span><span>▼</span></button><div class="menu" id="roleMenu"><div class="role-list">
<label class="role-option"><input type="checkbox" value="Dliever"><span>Dliever</span></label>
<label class="role-option"><input type="checkbox" value="Dcoded"><span>Dcoded</span></label>
<label class="role-option"><input type="checkbox" value="DCO"><span>DCO</span></label>
<label class="role-option"><input type="checkbox" value="MOD"><span>MOD</span></label>
<label class="role-option"><input type="checkbox" value="Regional Helper"><span>Regional Helper</span></label>
<label class="role-option"><input type="checkbox" value="Regional Lead"><span>Regional Lead</span></label>
<label class="role-option"><input type="checkbox" value="Community Team"><span>Community Team</span></label>
<label class="role-option"><input type="checkbox" value="DliCOM App User"><span>DliCOM App User</span></label>
<label class="role-option"><input type="checkbox" value="Team"><span>Team</span></label>
</div></div></div></div>

<div class="field"><label>Country / Region</label><div class="select-wrap"><button type="button" class="select-button" id="countryButton"><span id="countryText">🌐 Select country</span><span>▼</span></button><div class="menu" id="countryMenu"><input id="countrySearch" class="country-search" placeholder="Search country..."><div id="countryList" class="country-list"></div></div></div></div>

<div class="field"><label>OG Member</label><select id="og"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
<div class="field"><label>Member Since</label><input id="memberSince" type="month"></div>

<div class="field"><label>Personal Photo — optional</label><div class="upload"><input id="photoUpload" type="file" accept="image/png,image/jpeg,image/webp"><div class="hint">Optional photo will appear as a small profile badge.</div></div></div>

<div class="field"><label>Choose Card Background</label><div class="gallery" id="bgGallery"></div><div class="hint">Background 01 is the default. The other backgrounds are manual choices.</div></div>

<div class="actions"><button class="primary" id="generateBtn">Generate ID Card</button></div>
</section>

<section id="resultPage" class="result-page panel">
<div class="result-head"><h2>Your DliCOM ID Card</h2><button class="back-btn" id="editBtn">← Edit</button></div>
<div class="card-scroll"><div id="card" class="card">
<img id="cardBg" class="card-bg" src="backgrounds/bg1.png" crossorigin="anonymous"><div class="shade"></div>
<div class="card-text name-box"><div><div id="outName" class="card-name">Your Name</div><div id="outX" class="card-x">@username</div></div></div>
<div class="card-text left-box">
<div class="item"><label>DLICOM ID</label><div id="outId" class="value">DLC-XXXXXX</div></div>
<div class="item"><label>ROLE</label><div id="outRole" class="value roles-value">—</div></div>
</div>
<div class="card-text right-box">
<div class="item"><label>REGION</label><div id="outCountry" class="value">—</div></div>
<div class="item"><label>DISCORD</label><div id="outDiscord" class="value">—</div></div>
<div class="item"><label>GENDER</label><div id="outGender" class="value">—</div></div>
<div class="item"><label>OG / MEMBER SINCE</label><div id="outMeta" class="value">—</div></div>
</div>
<div id="outIdBottom" class="id-chip">DliCOM COMMUNITY MEMBER</div><img id="outPhoto" class="photo" alt="">
</div></div>
<div class="actions"><button class="primary" id="downloadBtn">Download PNG</button></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
const roles=[...document.querySelectorAll('#roleMenu input')];
const countries=[['AF','Afghanistan'],['AL','Albania'],['DZ','Algeria'],['AR','Argentina'],['AU','Australia'],['BD','Bangladesh'],['BE','Belgium'],['BT','Bhutan'],['BR','Brazil'],['CA','Canada'],['CN','China'],['DK','Denmark'],['EG','Egypt'],['FR','France'],['DE','Germany'],['GH','Ghana'],['GR','Greece'],['HK','Hong Kong'],['HU','Hungary'],['IN','India'],['ID','Indonesia'],['IE','Ireland'],['IT','Italy'],['JP','Japan'],['KZ','Kazakhstan'],['KE','Kenya'],['KR','South Korea'],['MY','Malaysia'],['MV','Maldives'],['MX','Mexico'],['NP','Nepal'],['NL','Netherlands'],['NZ','New Zealand'],['NG','Nigeria'],['NO','Norway'],['PK','Pakistan'],['PH','Philippines'],['PL','Poland'],['PT','Portugal'],['QA','Qatar'],['RO','Romania'],['RU','Russia'],['SA','Saudi Arabia'],['SG','Singapore'],['ZA','South Africa'],['ES','Spain'],['LK','Sri Lanka'],['SE','Sweden'],['CH','Switzerland'],['TW','Taiwan'],['TH','Thailand'],['TR','Turkey'],['UA','Ukraine'],['AE','United Arab Emirates'],['GB','United Kingdom'],['US','United States'],['VN','Vietnam'],['ZM','Zambia'],['ZW','Zimbabwe']];
const flag=c=>c.replace(/./g,x=>String.fromCodePoint(127397+x.charCodeAt(0)));
let selectedCountry='',selectedFlag='',selectedBg='backgrounds/bg1.png',photoData='';
function renderCountries(q=''){const list=$('countryList');list.innerHTML='';countries.filter(x=>x[1].toLowerCase().includes(q.toLowerCase().trim())).forEach(x=>{const d=document.createElement('div');d.className='country-option';d.innerHTML='<span class="flag">'+flag(x[0])+'</span><span>'+x[1]+'</span>';d.onclick=()=>{selectedCountry=x[1];selectedFlag=flag(x[0]);$('countryText').textContent=selectedFlag+' '+selectedCountry;$('countryMenu').classList.remove('open')};list.appendChild(d)});const d=document.createElement('div');d.className='country-option';d.innerHTML='<span class="flag">🌐</span><span>Other</span>';d.onclick=()=>{selectedCountry='Other';selectedFlag='🌐';$('countryText').textContent='🌐 Other';$('countryMenu').classList.remove('open')};list.appendChild(d)}
renderCountries();
$('countrySearch').oninput=e=>renderCountries(e.target.value);
$('roleButton').onclick=e=>{e.stopPropagation();$('roleMenu').classList.toggle('open');$('countryMenu').classList.remove('open')};
$('countryButton').onclick=e=>{e.stopPropagation();$('countryMenu').classList.toggle('open');$('roleMenu').classList.remove('open')};
$('roleMenu').onclick=e=>e.stopPropagation();$('countryMenu').onclick=e=>e.stopPropagation();document.onclick=()=>{$('roleMenu').classList.remove('open');$('countryMenu').classList.remove('open')};
function updateRoleText(){const r=roles.filter(x=>x.checked).map(x=>x.value);$('roleText').textContent=r.length?r.join(' • '):'Select roles'}roles.forEach(x=>x.onchange=updateRoleText);
const bgFiles=['backgrounds/bg1.png','backgrounds/bg2.png','backgrounds/bg3.png','backgrounds/bg4.png','backgrounds/bg5.png','backgrounds/bg6.png'];
bgFiles.forEach((src,i)=>{const b=document.createElement('button');b.type='button';b.className='bg-choice'+(i===0?' active':'');b.innerHTML='<img src="'+src+'" alt="Background '+(i+1)+'" crossorigin="anonymous">'+(i===0?'<span class="default-mark">DEFAULT</span>':'')+'<span class="tag">BG '+String(i+1).padStart(2,'0')+'</span>';b.onclick=()=>{selectedBg=src;document.querySelectorAll('.bg-choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')};$('bgGallery').appendChild(b)});
$('photoUpload').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{photoData=ev.target.result};r.readAsDataURL(f)};
function makeId(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='DLC-';for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function month(v){if(!v)return'—';const [y,m]=v.split('-');return new Date(y,m-1).toLocaleString('en',{month:'short',year:'numeric'})}
function setText(id,v){$(id).textContent=v}
$('generateBtn').onclick=()=>{
 const name=$('name').value.trim()||'Your Name';let x=$('xUsername').value.trim()||'@username';if(x!=='@username'&&!x.startsWith('@'))x='@'+x;const discord=$('discord').value.trim()||'—';const gender=$('gender').value||'—';const og=$('og').value||'—';const since=month($('memberSince').value);const rs=roles.filter(x=>x.checked).map(x=>x.value);const role=rs.length?rs.join(' • '):'—';const country=selectedCountry?(selectedFlag+' '+selectedCountry):'—';const id=makeId();
 setText('outName',name);setText('outX',x);setText('outId',id);setText('outRole',role);setText('outCountry',country);setText('outDiscord',discord);setText('outGender',gender);setText('outMeta',og+'  /  '+since);setText('outIdBottom',id+'  •  DliCOM COMMUNITY MEMBER');$('cardBg').src=selectedBg;
 const p=$('outPhoto');if(photoData){p.src=photoData;p.style.display='block'}else p.style.display='none';
 $('formPage').style.display='none';$('resultPage').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
};
$('editBtn').onclick=()=>{$('resultPage').classList.remove('show');$('formPage').style.display='block';window.scrollTo({top:0,behavior:'smooth'})};
$('downloadBtn').onclick=async()=>{const btn=$('downloadBtn');btn.disabled=true;btn.textContent='Generating PNG...';try{await new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=$('cardBg').src});const canvas=await html2canvas($('card'),{width:1024,height:1536,scale:2,useCORS:true,allowTaint:false,backgroundColor:'#05091c',logging:false,imageTimeout:20000,scrollX:0,scrollY:0});const a=document.createElement('a');const n=($('name').value.trim()||'DliCOM-ID').replace(/[^a-z0-9_-]/gi,'-');a.download='DliCOM-ID-'+n+'.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){console.error(e);alert('PNG তৈরি করা যায়নি। Background files ঠিক আছে কিনা দেখো এবং আবার চেষ্টা করো।')}btn.disabled=false;btn.textContent='Download PNG'};
</script>
</body>
</html>
